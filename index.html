<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Which Faction Are You? | Matthew</title>
    <link href="style.css" rel="stylesheet" type="text/css"/>
</head>
<body>
    <main>
        <section id="info">Matthew</section>
        <section class="factions-section" aria-labelledby="factions-heading">
            <h1 id="factions-heading">Factions</h1>
            <div class="faction-list">
                <article class="faction-card faction-abnegation">
                    <h2>Abnegation</h2>
                    <div class="faction-image">
                        <img src="images/abnegation.jpg" alt="Abnegation symbol">
                    </div>
                    <p>Matthew</p>
                </article>
                <article class="faction-card faction-erudite">
                    <h2>Erudite</h2>
                    <div class="faction-image">
                        <img src="images/erudite.jpg" alt="Erudite symbol">
                    </div>
                    <p>Matthew</p>
                </article>
                <article class="faction-card faction-dauntless">
                    <h2>Dauntless</h2>
                    <div class="faction-image">
                        <img src="images/dauntless.jpg" alt="Dauntless symbol">
                    </div>
                    <p>Matthew</p>
                </article>
                <article class="faction-card faction-amity">
                    <h2>Amity</h2>
                    <div class="faction-image">
                        <img src="images/amity.jpg" alt="Amity symbol">
                    </div>
                    <p>Matthew</p>
                </article>
                <article class="faction-card faction-candor">
                    <h2>Candor</h2>
                    <div class="faction-image">
                        <img src="images/candor.jpg" alt="Candor symbol">
                    </div>
                    <p>Matthew</p>
                </article>
            </div>
            <article class="divergent-card">
                <h2>Divergent</h2>
                <div class="divergent-image" role="img" aria-label="Blended faction-color image placeholder">
                    Image placeholder
                </div>
                <p>Matthew</p>
            </article>
        </section>
        <button id="take-quiz" type="button">Take the quiz <span aria-hidden="true">&rarr;</span></button>
        <section id="trivia" aria-label="Faction quiz" hidden></section>
    </main>
    <script src="script.js"></script>
</body>
</html>
